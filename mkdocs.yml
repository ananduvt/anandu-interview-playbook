site_name: Anandu's Interview Playbook
site_description: A living, shareable interview-prep playbook.
site_url: https://ananduvt.github.io/anandu-interview-playbook/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# Only files under docs/ are published. The internal/ folder at repo root is never built.
nav:
  - Home: index.md
  - Foundations:
      - Design Principles: foundations/design-principles.md
  - Java:
      - Versions & Features: java/versions.md
  - Spring & Web:
      - API Styles & Protocols: spring-web/api-styles.md
  - Databases: databases/index.md
  - Distributed & Cloud:
      - Microservices Principles: distributed-cloud/principles.md
  - Backlog: backlog.md
